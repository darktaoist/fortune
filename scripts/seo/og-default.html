<!doctype html>
<!--
  og:default 소셜 공유 카드(1200×630). 헤드리스 크롬 스크린샷으로 public/og-default.png 생성.
  브랜드 토큰: 배경 #0A0A0F, 골드 #C9A84C, 워드마크 타오운세 / Tao Fortune.
  재생성: node scripts/seo/render-og.mjs (Chrome --headless --screenshot)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background:
      radial-gradient(900px 520px at 50% 30%, rgba(201,168,76,0.14), transparent 60%),
      radial-gradient(600px 400px at 85% 90%, rgba(201,168,76,0.08), transparent 55%),
      #0A0A0F;
    color: #F4EFE3;
    font-family: "Apple SD Gothic Neo", "Noto Serif KR", "Nanum Myeongjo", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* 얇은 골드 테두리 프레임 */
  .frame {
    position: absolute; inset: 28px;
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 18px;
  }
  /* 상단 한자 인장 */
  .seal {
    width: 96px; height: 96px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #C9A84C; border-radius: 50%;
    color: #C9A84C; font-size: 52px; font-weight: 700; line-height: 1;
    margin-bottom: 34px;
    box-shadow: 0 0 40px rgba(201,168,76,0.25);
  }
  .wordmark {
    font-size: 116px; font-weight: 800; letter-spacing: 2px;
    color: #F4EFE3;
    text-shadow: 0 2px 30px rgba(0,0,0,0.5);
  }
  .gold { color: #C9A84C; }
  .tagline {
    margin-top: 26px;
    font-size: 34px; font-weight: 500; letter-spacing: 1px;
    color: #C9B98A;
  }
  .latin {
    margin-top: 14px;
    font-size: 24px; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(244,239,227,0.55);
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="seal">道</div>
  <div class="wordmark">타오<span class="gold">운세</span></div>
  <div class="tagline">AI 사주 · 토정비결 · 평생운세</div>
  <div class="latin">Tao Fortune</div>
</body>
</html>
